[project]
name = "memorization-backend"
version = "0.1.0"
description = "Spaced-repetition backend: FSRS scheduling + LLM-graded typed answers + incremental reading"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # [asyncio] pulls in greenlet, which SQLAlchemy 2.1 no longer installs by
    # default; without it the app fails on import.
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "fsrs>=6.0,<7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
    # Page-level PDF text extraction — page numbers are what make a card's
    # citation ("p. 42") point at something the user can actually go read.
    "pypdf>=4.2",
]

[project.optional-dependencies]
# Personalized FSRS weight refitting (§3). Pulls in torch — large.
optimizer = ["fsrs[optimizer]>=6.0,<7"]
# asgi-lifespan drives startup/shutdown around the ASGI app in tests/conftest.py.
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "asgi-lifespan>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Pinned explicitly so linting doesn't drift with a parent-directory config.

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    # `x: T = Depends(...)` / `File(...)` is the FastAPI idiom, not a mutable default.
    "B008",
    "E501",   # line length is handled by the formatter
    # `class Grade(str, Enum)` is what the spec's §7.1 schema defines, and it is
    # the conventional FastAPI form. StrEnum would change str() output.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]  # conftest sets env vars before importing the app
"app/services/fundamentals_catalog.py" = ["RUF001", "RUF003", "W291", "W293"]
"app/services/problems_catalog.py" = ["W291", "W293"]
# Course-content strings legitimately contain typographic dashes.
"scripts/populate_cpsc210.py" = ["RUF001", "RUF003"]

