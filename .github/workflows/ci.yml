name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Code practice tests run TypeScript through Node 24's type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # No Ollama on the runner: the suite mocks it. A test that reaches for a
      # real daemon is a bug in the test.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # frontend/dist is committed because the one-click launchers and the
      # tunnel serve it straight from the repo. That only works if it matches
      # the source, so a change to src/ without a rebuild fails here.
      - name: Committed build matches the source
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::frontend/dist is out of date. Run 'npm run build' in frontend/ and commit the result."
            git diff --stat -- dist
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::frontend/dist has untracked or missing files. Run 'npm run build' in frontend/ and commit the result."
            git status --porcelain -- dist
            exit 1
          fi
